name: Validate PflegeLern P25B

on:
  push:
    branches: [p25b-question-repetition-control]
    paths:
      - 'data/manifest.json'
      - 'js/p25b-repetition-core.js'
      - 'js/p25b-repetition.js'
      - 'js/p18-bootstrap.js'
      - 'service-worker.js'
      - 'tests/p25b-repetition-core.test.mjs'
      - 'tests/p25b-browser.spec.mjs'
      - '.github/workflows/validate-p25b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check js/p25b-repetition-core.js
          node --check js/p25b-repetition.js
          node --check js/p18-bootstrap.js
          node --check service-worker.js
          node --check tests/p25b-repetition-core.test.mjs
          node --check tests/p25b-browser.spec.mjs

      - name: P25B repetition core
        run: node tests/p25b-repetition-core.test.mjs

      - name: P17 adaptive mix regression
        run: node tests/p17-study-mix.test.mjs && node tests/p17-runtime.test.mjs

      - name: P18 mastery regression
        run: node tests/p18-mastery.test.mjs

      - name: P19 remediation regression
        run: node tests/p19-remediation.test.mjs

      - name: P20 mock exam regression
        run: node tests/p20-exam-core.test.mjs && node tests/p20-runtime.test.mjs

      - name: P25A bank preservation
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          questions = json.loads(Path('data/questions.json').read_text())
          report = json.loads(Path('P25A_QUESTION_VARIETY_REPORT.json').read_text())
          counts = Counter(q['type'] for q in questions)
          assert len(questions) == 1299
          assert counts == Counter({
              'single_choice': 699,
              'short_answer': 321,
              'clinical_case': 214,
              'matching': 39,
              'multiple_choice': 24,
              'ordering': 2,
          })
          assert report['legacyPreservation']['preservedExactly'] is True
          assert report['generatedQuestions'] == 345
          print('P25A question bank preserved')
          PY

      - name: P25B integration contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/manifest.json').read_text())
          bootstrap = Path('js/p18-bootstrap.js').read_text()
          runtime = Path('js/p25b-repetition.js').read_text()
          sw = Path('service-worker.js').read_text()
          assert manifest['phase'] == 'P25B'
          assert manifest['version'] == '1.1.0-dev.25b'
          assert manifest['status'] == 'p25b-question-repetition-control'
          assert 'installAdaptiveMixPatches();\ninstallQuestionRepetitionPatches();' in bootstrap
          assert 'p25bSessionExposure' in runtime
          assert 'applyQuestionRepetitionGuard' in runtime
          assert "const CACHE_PREFIX = 'pflegelern-'" in sw
          assert "const CACHE = 'pflegelern-p25b-v1.1.0-dev25b'" in sw
          assert "'./js/p25b-repetition-core.js'" in sw
          assert "'./js/p25b-repetition.js'" in sw
          print('P25B integration contract PASS')
          PY

  browser-qa:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pflegelern-http.log 2>&1 &
          echo $! > /tmp/pflegelern-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pflegelern-http.log
          exit 1

      - name: Chromium P25B repetition QA
        run: npx playwright test tests/p25b-browser.spec.mjs --reporter=line --workers=1

      - name: Upload browser QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p25b-browser-qa-artifacts
          path: test-results
          if-no-files-found: ignore
