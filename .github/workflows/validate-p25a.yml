name: Validate PflegeLern P25A

on:
  push:
    branches: [p25a-question-variety-rebalance]
    paths:
      - 'data/questions.json'
      - 'data/manifest.json'
      - 'P25A_QUESTION_VARIETY_REPORT.json'
      - 'js/p25a-variety-core.js'
      - 'js/p17-study-mix.js'
      - 'service-worker.js'
      - 'tests/p25a-variety-core.test.mjs'
      - 'tests/p25a-browser.spec.mjs'
      - '.github/workflows/validate-p25a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check js/p25a-variety-core.js
          node --check js/p17-study-mix.js
          node --check service-worker.js
          node --check tests/p25a-variety-core.test.mjs
          node --check tests/p25a-browser.spec.mjs

      - name: P25A variety planner
        run: node tests/p25a-variety-core.test.mjs

      - name: P17 adaptive mix regression
        run: node tests/p17-study-mix.test.mjs && node tests/p17-runtime.test.mjs

      - name: P18 mastery regression
        run: node tests/p18-mastery.test.mjs

      - name: P19 remediation regression
        run: node tests/p19-remediation.test.mjs

      - name: P20 mock exam regression
        run: node tests/p20-exam-core.test.mjs && node tests/p20-runtime.test.mjs

      - name: P24 affected-surface regression invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sw = Path('service-worker.js').read_text()
          assert "const CACHE_PREFIX = 'pflegelern-'" in sw
          assert 'key.startsWith(CACHE_PREFIX) && key !== CACHE' in sw
          assert "const CACHE = 'pflegelern-p25a-v1.1.0-dev25a'" in sw
          assert "'./css/p24-regression.css'" in sw
          assert "'./js/p24-ui.js'" in sw
          assert "'./data/questions.json'" in sw
          print('P24 affected-surface invariants PASS')
          PY

      - name: P25A content certification
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          questions = json.loads(Path('data/questions.json').read_text())
          manifest = json.loads(Path('data/manifest.json').read_text())
          report = json.loads(Path('P25A_QUESTION_VARIETY_REPORT.json').read_text())

          assert len(questions) == 1299, len(questions)
          counts = Counter(q['type'] for q in questions)
          assert counts == Counter({
              'single_choice': 699,
              'short_answer': 321,
              'clinical_case': 214,
              'matching': 39,
              'multiple_choice': 24,
              'ordering': 2,
          }), counts
          assert manifest['phase'] == 'P25A'
          assert manifest['version'] == '1.1.0-dev.25a'
          assert manifest['status'] == 'p25a-question-variety-rebalance'
          assert report['status'] == 'PASS'
          assert report['legacyPreservation']['count'] == 954
          assert report['legacyPreservation']['preservedExactly'] is True
          assert report['singleChoiceShare']['after'] <= 0.56

          legacy = questions[:954]
          payload = json.dumps(legacy, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          assert hashlib.sha256(payload).hexdigest() == report['legacyPreservation']['canonicalSha256']

          ids = [q['id'] for q in questions]
          assert len(ids) == len(set(ids))
          generated = [q for q in questions if q.get('certification') == 'p25a-source-derived-v1']
          assert len(generated) == 345
          assert all(q.get('sourceIds') for q in generated)
          assert sum(q['type'] == 'short_answer' for q in generated) == 320
          assert sum(q['type'] == 'matching' for q in generated) == 24
          assert sum(q['type'] == 'ordering' for q in generated) == 1
          print('P25A content certification PASS')
          PY

  browser-qa:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pflegelern-http.log 2>&1 &
          echo $! > /tmp/pflegelern-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pflegelern-http.log
          exit 1

      - name: Chromium P25A interaction QA
        run: npx playwright test tests/p25a-browser.spec.mjs --reporter=line --workers=1

      - name: Upload browser QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p25a-browser-qa-artifacts
          path: test-results
          if-no-files-found: ignore
