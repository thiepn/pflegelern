name: PflegeLern P10 Live Verify

on:
  pull_request:
    paths:
      - 'P10_VERIFY'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: p10-live-verify
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static release assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f data/cards.json
          grep -q '<title>PflegeLern</title>' index.html
          grep -q '"version": "1.0.0"' data/manifest.json
          grep -q "pflegelern-v1.0.0" service-worker.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
