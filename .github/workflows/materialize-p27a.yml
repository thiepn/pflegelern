name: Materialize PflegeLern P27A audit

on:
  push:
    branches: [p27a-release-readiness-audit]
    paths:
      - '.github/workflows/materialize-p27a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p27a-release-readiness-audit
          fetch-depth: 1

      - name: Generate release-readiness audit
        run: python3 tools/p27a_release_readiness_audit.py --write

      - name: Require expected audit posture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/P27A_RELEASE_READINESS_AUDIT.json').read_text(encoding='utf-8'))
          assert r['phase']=='P27A'
          assert r['status']=='ACTION_REQUIRED'
          assert r['certifiedQuestionBank']['intact'] is True
          assert r['summary']['staticRuntimeBlockers']==0
          assert r['summary']['actionableFindings']>=4
          assert r['nextPhase']['phase']=='P27B'
          print('P27A audit materialized with intact runtime baseline and release-truth findings.')
          PY

      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/P27A_RELEASE_READINESS_AUDIT.json reports/P27A_RELEASE_READINESS_AUDIT.md
          git diff --cached --exit-code && exit 0
          git commit -m 'P27A: materialize release readiness audit [skip ci]'
          git push origin HEAD:p27a-release-readiness-audit
