name: Inspect PflegeLern P26C candidates

on:
  push:
    branches: [p26c-manual-review-adjudication]
    paths:
      - 'tools/p26c_review_packets.py'
      - 'tools/p26c_adjudicate.py'
      - 'tools/p26c_adjudication_refinement.py'
      - '.github/workflows/inspect-p26c.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P26C adjudication preview
        run: python3 tools/p26c_adjudication_refinement.py
      - name: Inspect q-36-10 source contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          qs=json.loads(Path('data/questions.json').read_text())
          cs=json.loads(Path('data/cards.json').read_text())
          q=next(x for x in qs if x['id']=='q-36-10')
          print(json.dumps(q, ensure_ascii=False, indent=2))
          ids=set(q.get('conceptIds',[]))
          for c in cs:
            cids=set(c.get('conceptIds') or [])
            if c.get('conceptId'): cids.add(c['conceptId'])
            if ids & cids:
              print(json.dumps(c, ensure_ascii=False, indent=2))
          PY
      - name: Candidate summary
        run: python3 tools/p26c_review_packets.py --batch 0 --batch-size 0
      - name: Answer-option subsumption
        run: python3 tools/p26c_review_packets.py --issue ANSWER_OPTION_SUBSUMPTION
      - name: Clinical cases without context
        run: python3 tools/p26c_review_packets.py --issue CLINICAL_CASE_WITHOUT_CASE_CONTEXT
      - name: Exact prompt duplicates
        run: python3 tools/p26c_review_packets.py --issue EXACT_PROMPT_DUPLICATE
      - name: Absolute-wording distractors
        run: python3 tools/p26c_review_packets.py --issue DISTRACTOR_ABSOLUTE_WORDING_CLUSTER
