name: Inspect PflegeLern P26C candidates

on:
  push:
    branches: [p26c-manual-review-adjudication]
    paths:
      - 'tools/p26c_review_packets.py'
      - '.github/workflows/inspect-p26c.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Candidate summary
        run: python3 tools/p26c_review_packets.py --batch 0 --batch-size 0
      - name: Answer-option subsumption
        run: python3 tools/p26c_review_packets.py --issue ANSWER_OPTION_SUBSUMPTION
      - name: Clinical cases without context
        run: python3 tools/p26c_review_packets.py --issue CLINICAL_CASE_WITHOUT_CASE_CONTEXT
      - name: Exact prompt duplicates
        run: python3 tools/p26c_review_packets.py --issue EXACT_PROMPT_DUPLICATE
      - name: Absolute-wording distractors
        run: python3 tools/p26c_review_packets.py --issue DISTRACTOR_ABSOLUTE_WORDING_CLUSTER
      - name: Broad reference answers
        run: python3 tools/p26c_review_packets.py --issue BROAD_REFERENCE_ANSWER_TO_NARROW_PROMPT
      - name: Under-specified free responses batch 1
        run: python3 tools/p26c_review_packets.py --issue UNDER_SPECIFIED_FREE_RESPONSE_PROMPT --batch 0 --batch-size 20
      - name: Under-specified free responses batch 2
        run: python3 tools/p26c_review_packets.py --issue UNDER_SPECIFIED_FREE_RESPONSE_PROMPT --batch 1 --batch-size 20
      - name: Under-specified free responses batch 3
        run: python3 tools/p26c_review_packets.py --issue UNDER_SPECIFIED_FREE_RESPONSE_PROMPT --batch 2 --batch-size 20
