name: Bootstrap PflegeLern P10

on:
  push:
    paths:
      - 'release/payload.part10'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bootstrap-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          cat release/payload.part* | base64 -d > /tmp/pflegelern-p10.tar.xz
          mkdir -p /tmp/pflegelern-release
          tar -xJf /tmp/pflegelern-p10.tar.xz -C /tmp/pflegelern-release
          test -f /tmp/pflegelern-release/p10_work/index.html
          test -f /tmp/pflegelern-release/p10_work/data/cards.json

      - name: Replace repository with release source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pflegelern-release/p10_work/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release PflegeLern v1.0.0-rc.1'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
