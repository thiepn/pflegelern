name: Materialize PflegeLern P26E closure evidence

on:
  push:
    branches: [p26e-semantic-closure-certification]
    paths:
      - '.github/workflows/materialize-p26e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p26e-semantic-closure-certification
          fetch-depth: 1

      - name: Freeze P26D-certified question bank
        run: sha256sum data/questions.json | tee /tmp/p26e-question-before.sha

      - name: Syntax checks
        run: |
          python3 -m py_compile tools/p26e_semantic_closure.py
          python3 -m py_compile tests/p26e-semantic-closure.test.py

      - name: Materialize deterministic P26E closure reports
        run: python3 tools/p26e_semantic_closure.py --write

      - name: P26E closure certification
        run: python3 tests/p26e-semantic-closure.test.py

      - name: Assert question bank remained byte-identical
        run: |
          sha256sum data/questions.json | tee /tmp/p26e-question-after.sha
          diff -u /tmp/p26e-question-before.sha /tmp/p26e-question-after.sha
          git diff --exit-code -- data/questions.json

      - name: Commit closure evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/P26E_SEMANTIC_CLOSURE.json reports/P26E_SEMANTIC_CLOSURE.md
          git diff --cached --exit-code && exit 0
          git commit -m 'P26E: materialize semantic closure evidence [skip ci]'
          git push origin HEAD:p26e-semantic-closure-certification
