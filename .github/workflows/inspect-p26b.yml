name: Inspect PflegeLern P26B source evidence

on:
  push:
    branches: [p26b-semantic-defect-correction]
    paths:
      - 'tools/p26b_inspect.py'
      - '.github/workflows/inspect-p26b.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print target questions and source evidence
        run: python3 tools/p26b_inspect.py
