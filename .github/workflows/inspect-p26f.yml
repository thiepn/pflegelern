name: Inspect PflegeLern P26F source alignment

on:
  push:
    branches: [p26f-source-alignment-correction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run source-alignment audit
        run: python3 tools/p26f_source_alignment.py --write
      - name: Inspect seven residual source-alignment cases
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          qs=json.loads(Path('data/questions.json').read_text(encoding='utf-8'))
          cs=json.loads(Path('data/concepts.json').read_text(encoding='utf-8'))
          cards=json.loads(Path('data/cards.json').read_text(encoding='utf-8'))
          secs=json.loads(Path('data/sections.json').read_text(encoding='utf-8'))
          qids={'q-36-05','q-61-4-01','q-case-p7b-skin-test','q-case-pulse-01','q-p12-0207','q-p12-0630','p25a-sa-b059de1da1f29d'}
          qrows=[q for q in qs if q['id'] in qids]
          cids={cid for q in qrows for cid in q.get('conceptIds',[])}
          crows=[c for c in cs if c['id'] in cids]
          cardrows=[]
          for card in cards:
            ids=set(card.get('conceptIds') or [])
            if card.get('conceptId'): ids.add(card['conceptId'])
            if ids & cids: cardrows.append(card)
          # Print nearby section candidates for the two null-section concepts.
          pages={p for c in crows for p in (c.get('source') or {}).get('printedPages',[])}
          secrows=[s for s in secs if s.get('chapterId') in {'chapter-4','chapter-8'} and any(abs((s.get('firstPdfPage') or -999)-p) <= 4 for p in pages)]
          print('QUESTIONS='+json.dumps(qrows,ensure_ascii=False,indent=2))
          print('CONCEPTS='+json.dumps(crows,ensure_ascii=False,indent=2))
          print('CARDS='+json.dumps(cardrows,ensure_ascii=False,indent=2))
          print('NEARBY_SECTIONS='+json.dumps(secrows,ensure_ascii=False,indent=2))
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: p26f-source-alignment-audit
          path: |
            reports/P26F_SOURCE_ALIGNMENT_AUDIT.json
            reports/P26F_SOURCE_ALIGNMENT_AUDIT.md
