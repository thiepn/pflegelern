name: Inspect PflegeLern P26F source alignment

on:
  push:
    branches: [p26f-source-alignment-correction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run source-alignment audit
        run: python3 tools/p26f_source_alignment.py --write
      - name: Inspect source hierarchy gaps
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cs=json.loads(Path('data/concepts.json').read_text(encoding='utf-8'))
          secs=json.loads(Path('data/sections.json').read_text(encoding='utf-8'))
          cards=json.loads(Path('data/cards.json').read_text(encoding='utf-8'))
          def pages(c): return (c.get('source') or {}).get('printedPages',[])
          near_concepts=[c for c in cs if (c.get('chapterId') in {'chapter-3','chapter-4','chapter-8'} and any(p in range(30,36) or p in range(144,150) for p in pages(c)))]
          near_sections=[s for s in secs if (s.get('chapterId') in {'chapter-3','chapter-4','chapter-8'} and 30 <= (s.get('firstPdfPage') or -1) <= 150)]
          ids={c['id'] for c in near_concepts}
          near_cards=[]
          for card in cards:
            cids=set(card.get('conceptIds') or [])
            if card.get('conceptId'): cids.add(card['conceptId'])
            if cids & ids: near_cards.append(card)
          print('NEAR_CONCEPTS='+json.dumps(near_concepts,ensure_ascii=False,indent=2))
          print('NEAR_SECTIONS='+json.dumps(near_sections,ensure_ascii=False,indent=2))
          print('NEAR_CARDS='+json.dumps(near_cards,ensure_ascii=False,indent=2))
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: p26f-source-alignment-audit
          path: |
            reports/P26F_SOURCE_ALIGNMENT_AUDIT.json
            reports/P26F_SOURCE_ALIGNMENT_AUDIT.md
