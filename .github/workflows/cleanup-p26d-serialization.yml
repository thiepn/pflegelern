name: Cleanup P26D question-bank serialization

on:
  push:
    branches: [p26d-confirmed-defect-repair]
    paths:
      - '.github/workflows/cleanup-p26d-serialization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore compact bank serialization and repair generator
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          questions_path=Path('data/questions.json')
          data=json.loads(questions_path.read_text(encoding='utf-8'))
          compact=json.dumps(data, ensure_ascii=False, separators=(',', ':'))
          questions_path.write_text(compact, encoding='utf-8')
          after=hashlib.sha256(compact.encode('utf-8')).hexdigest()

          tool_path=Path('tools/p26d_apply_repairs.py')
          tool=tool_path.read_text(encoding='utf-8')
          old="output_text = json.dumps(questions, ensure_ascii=False, indent=2) + '\\n'"
          new="output_text = json.dumps(questions, ensure_ascii=False, separators=(',', ':'))"
          assert old in tool, 'expected P26D serializer line not found'
          tool_path.write_text(tool.replace(old, new, 1), encoding='utf-8')

          report_path=Path('reports/P26D_CONFIRMED_DEFECT_REPAIR.json')
          report=json.loads(report_path.read_text(encoding='utf-8'))
          report['baseline']['questionBankAfterSha256']=after
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('compact P26D bank SHA-256:', after)
          PY
      - name: Verify semantic content after compaction
        run: python3 tests/p26d-confirmed-defect-repair.test.py
      - name: Commit serialization cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions.json tools/p26d_apply_repairs.py reports/P26D_CONFIRMED_DEFECT_REPAIR.json
          git commit -m 'P26D: restore compact question-bank serialization [skip ci]'
          git push origin HEAD:p26d-confirmed-defect-repair
