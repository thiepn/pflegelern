name: Publish PflegeLern v1.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pflegelern-v1.1.0-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_BASE: https://thiepn.dev/pflegelern
      TAG: v1.1.0
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect existing final release
        id: existing
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; publication is idempotently complete."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Certify exact main release payload
        if: steps.existing.outputs.already != 'true'
        run: |
          python3 tools/release_readiness.py --full --check-report
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected='40233f783c322c5da5e2c24adbe1ec12651ae2b2011d35a7d4adb61b172ce024'
          manifest=json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['phase']=='P27C'
          assert manifest['version']=='1.1.0'
          assert manifest['status']=='released'
          assert hashlib.sha256(Path('data/questions.json').read_bytes()).hexdigest()==expected
          print('Exact main payload is P27C / 1.1.0 / released with frozen P26G bank intact.')
          PY

      - name: Wait for exact final identity on GitHub Pages
        if: steps.existing.outputs.already != 'true'
        run: |
          for i in $(seq 1 90); do
            url="$LIVE_BASE/data/manifest.json?release_sha=$GITHUB_SHA&attempt=$i"
            if curl --location --fail --silent --show-error "$url" -o /tmp/live-manifest.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              m=json.loads(Path('/tmp/live-manifest.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if (m.get('phase'),m.get('version'),m.get('status')) == ('P27C','1.1.0','released') else 1)
          PY
              then
                echo "Final P27C identity is live on GitHub Pages."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Timed out before final P27C identity became live." >&2
          exit 1

      - name: Real-Chromium certification against live Pages
        if: steps.existing.outputs.already != 'true'
        env:
          PFLEGELERN_BASE_URL: https://thiepn.dev/pflegelern
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test tests/p27c-browser.spec.mjs --reporter=line --workers=1

      - name: Verify live final certification report
        if: steps.existing.outputs.already != 'true'
        run: |
          curl --location --fail --silent --show-error "$LIVE_BASE/reports/P27C_FINAL_RELEASE_CERTIFICATION.json?release_sha=$GITHUB_SHA" -o /tmp/live-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/live-report.json').read_text(encoding='utf-8'))
          assert r['phase']=='P27C'
          assert r['status']=='PASS'
          assert r['summary']['failed']==0
          assert r['summary']['finalReleaseReady'] is True
          assert r['certifiedQuestionBank']['intact'] is True
          print('Live P27C final certification report verified.')
          PY

      - name: Create exact-main v1.1.0 tag
        if: steps.existing.outputs.already != 'true'
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            target=$(git rev-list -n 1 "$TAG")
            test "$target" = "$GITHUB_SHA"
            echo "Existing tag $TAG already targets exact main commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "PflegeLern v1.1.0"
            git push origin "$TAG"
          fi

      - name: Publish GitHub release v1.1.0
        if: steps.existing.outputs.already != 'true'
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PflegeLern v1.1.0" \
            --notes-file P27C_RELEASE.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
