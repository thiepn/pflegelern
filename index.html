<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151918" media="(prefers-color-scheme: dark)">
  <meta name="description" content="PflegeLern – ruhiges, adaptives Lernen mit Flashcards und Prüfungsfragen.">
  <title>PflegeLern</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/study.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/p14-calibration.css">
  <link rel="stylesheet" href="./css/p15-free-recall.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <a class="brand" href="?view=today" data-route="today" aria-label="PflegeLern – Heute">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7.5 5.5h9A2.5 2.5 0 0 1 19 8v10.5H8A3 3 0 0 1 5 15.5V8a2.5 2.5 0 0 1 2.5-2.5Z"/><path d="M8 18.5a3 3 0 0 1 0-6h11"/><path d="M12 8v4M10 10h4"/></svg>
        </span>
        <span>PflegeLern</span>
      </a>
      <nav class="side-nav">
        <a href="?view=today" data-route="today" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg><span>Heute</span>
        </a>
        <a href="?view=learn" data-route="learn" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12H7.5A2.5 2.5 0 0 1 5 16.5v-12Z"/><path d="M7.5 14H18"/></svg><span>Lernen</span>
        </a>
        <a href="?view=exam" data-route="exam" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3H8z"/><path d="M6 6h12v14H6z"/><path d="m9 13 2 2 4-5"/></svg><span>Prüfung</span>
        </a>
        <a href="?view=progress" data-route="progress" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Fortschritt</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="?view=settings" data-route="settings" class="nav-link nav-link-secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.08-1l2-1.5-2-3.5-2.4 1A7 7 0 0 0 15 6l-.3-2.5h-4L10.4 6A7 7 0 0 0 8.9 7L6.5 6l-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.5 1l.3 2.5h4L15 18a7 7 0 0 0 1.5-1l2.4 1 2-3.5-2-1.5c.05-.33.08-.66.08-1Z"/></svg><span>Einstellungen</span>
        </a>
      </div>
    </aside>

    <header class="mobile-header">
      <a class="mobile-brand" href="?view=today" data-route="today">PflegeLern</a>
      <div class="header-actions">
        <span class="offline-indicator" id="offline-indicator" hidden>Offline</span>
        <a class="icon-button" href="?view=settings" data-route="settings" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.08-1l2-1.5-2-3.5-2.4 1A7 7 0 0 0 15 6l-.3-2.5h-4L10.4 6A7 7 0 0 0 8.9 7L6.5 6l-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.5 1l.3 2.5h4L15 18a7 7 0 0 0 1.5-1l2.4 1 2-3.5-2-1.5c.05-.33.08-.66.08-1Z"/></svg>
        </a>
      </div>
    </header>

    <main id="main" class="main-content" tabindex="-1" aria-live="polite">
      <div class="initial-loader" role="status"><span class="spinner" aria-hidden="true"></span>App wird geladen …</div>
    </main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a href="?view=today" data-route="today" class="bottom-nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg><span>Heute</span>
      </a>
      <a href="?view=learn" data-route="learn" class="bottom-nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12H7.5A2.5 2.5 0 0 1 5 16.5v-12Z"/><path d="M7.5 14H18"/></svg><span>Lernen</span>
      </a>
      <a href="?view=exam" data-route="exam" class="bottom-nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3H8z"/><path d="M6 6h12v14H6z"/><path d="m9 13 2 2 4-5"/></svg><span>Prüfung</span>
      </a>
      <a href="?view=progress" data-route="progress" class="bottom-nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Fortschritt</span>
      </a>
    </nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="assertive" aria-atomic="true"></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
      <h2 id="confirm-title">Bestätigen</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button button-secondary">Abbrechen</button>
        <button value="confirm" class="button button-danger" id="confirm-action">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <input id="restore-input" type="file" accept="application/json,.json" hidden>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/p14-calibration.js"></script>
  <script type="module" src="./js/p15-free-recall.js"></script>
</body>
</html>
